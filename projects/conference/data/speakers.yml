speakers:
  - name: "Priya Nair"
    role: "Staff Engineer, Orbit"
    talk: "Consensus without the ceremony"
    bio: "Works on Orbit's replication layer. Previously built a payments queue that never lost a message."
  - name: "Marcus Webb"
    role: "Independent"
    talk: "Backpressure is a UX problem"
    bio: "Spent a decade on infrastructure teams before going independent. Writes about the boring parts of distributed systems."
  - name: "Sofia Bianchi"
    role: "Founder, Ledgerline"
    talk: "What we got wrong about idempotency"
    bio: "Started Ledgerline after three separate companies paged her at 3am for the same bug."
  - name: "Tomas Arruda"
    role: "Research Engineer, INESC"
    talk: "CRDTs for people in a hurry"
    bio: "Publishes on conflict-free replication. Still thinks vector clocks are fine, actually."
